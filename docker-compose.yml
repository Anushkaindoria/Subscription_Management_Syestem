version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: loopos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loopos
      POSTGRES_PASSWORD: loopos_secret_password
      POSTGRES_DB: loopos_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopos -d loopos_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: loopos-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: "" # In-memory

volumes:
  pgdata:
    driver: local
